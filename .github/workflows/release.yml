name: Release
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Semver bump level"
        required: true
        default: patch
        type: choice
        options: [patch, minor, major]
      skip_ci_check:
        description: "Release even if CI on this commit is not green (emergencies only)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.new }}
      tag: v${{ steps.bump.outputs.new }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Guard - run from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Releases must be cut from main (this run is on ${GITHUB_REF})."
          exit 1

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard - CI passed on this commit
        if: ${{ !inputs.skip_ci_check }}
        run: |
          conclusion="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&event=push&per_page=1" \
            --jq '.workflow_runs[0].conclusion // "none"')"
          echo "CI on ${GITHUB_SHA:0:12}: ${conclusion}"
          if [ "$conclusion" != "success" ]; then
            echo "::error::CI is '${conclusion}' on ${GITHUB_SHA:0:12}. Wait for a green CI run on main, or re-run with skip_ci_check."
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tooling
        run: pip install hatch git-cliff

      - name: Bump version
        id: bump
        run: |
          hatch version ${{ inputs.bump }}
          echo "new=$(hatch version)" >> "$GITHUB_OUTPUT"

      - name: Guard - version not already released
        env:
          NEW: ${{ steps.bump.outputs.new }}
        run: |
          if git rev-parse -q --verify "refs/tags/v${NEW}" >/dev/null; then
            echo "::error::Tag v${NEW} already exists."; exit 1
          fi
          code="$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/loglensai/${NEW}/json")"
          if [ "$code" = "200" ]; then
            echo "::error::loglensai ${NEW} is already on PyPI (versions there are immutable). Bump further."; exit 1
          fi
          echo "v${NEW} is free on GitHub and PyPI."

      - name: Update changelog + release notes
        env:
          NEW: ${{ steps.bump.outputs.new }}
        run: |
          git cliff --tag "v${NEW}" -o CHANGELOG.md
          git cliff --unreleased --tag "v${NEW}" --strip header -o RELEASE_NOTES.md

      - name: Commit, tag, push
        env:
          NEW: ${{ steps.bump.outputs.new }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/loglens/_version.py CHANGELOG.md
          git commit -m "chore(release): v${NEW}"
          git tag "v${NEW}"
          git push origin HEAD --tags

      - name: Create draft GitHub Release
        env:
          NEW: ${{ steps.bump.outputs.new }}
        run: |
          # Draft until binaries and PyPI are done, so installers never see a
          # "latest" release without assets.
          gh release create "v${NEW}" --draft \
            --title "v${NEW}" \
            --notes-file RELEASE_NOTES.md

  binaries:
    needs: prepare
    uses: ./.github/workflows/release-binaries.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      ref: ${{ needs.prepare.outputs.tag }}
      publish: true
    secrets: inherit

  pypi:
    needs: [prepare, binaries]
    uses: ./.github/workflows/publish-pypi.yml
    with:
      tag: ${{ needs.prepare.outputs.tag }}
    secrets: inherit

  publish:
    needs: [prepare, pypi]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - name: Publish the GitHub Release
        run: |
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          echo "::notice::Published ${TAG}."

  verify:
    needs: [prepare, publish]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Tag, version, PyPI and assets agree
        # Retries ride out PyPI index and download-CDN propagation.
        run: bash scripts/verify_release.sh "${{ needs.prepare.outputs.version }}" --pypi --installers --retries 6
