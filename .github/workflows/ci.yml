name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Generate test fixture (so accuracy tests run, not skip)
        run: python tests/fixtures/generate_logs.py

      - name: Run test suite
        run: pytest -q

      - name: Guard against silent skips
        run: |
          pytest tests/test_accuracy.py -q -rs 2>&1 | tee out.txt
          if grep -qiE "no tests ran|collected 0 items" out.txt; then
            echo "::error:: accuracy tests did not run"; exit 1
          fi

  accuracy-gate:
    name: accuracy gate (BGL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Fetch BGL sample
        run: bash scripts/fetch_benchmark.sh

      - name: Accuracy gate (unsupervised + supervised floors)
        run: python scripts/ci_accuracy_gate.py

      - name: Unsupervised min-F1 gate (CLI)
        run: loglens benchmark benchmarks/BGL_2k.log --format bgl --min-f1 0.45

  consistency:
    name: consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: "Version consistency (single source of truth)"
        run: |
          pip install hatch
          python - <<'PY'
          import re, subprocess, sys, loglens
          src = subprocess.check_output(["hatch","version"], text=True).strip()
          api = loglens.__version__
          cli = subprocess.check_output(["loglens","version"], text=True)
          m = re.search(r"version\s+([0-9][^\s]*)", cli)
          cli_v = m.group(1) if m else "?"
          print(f"_version.py={src}  api={api}  cli={cli_v}")
          if not (src == api == cli_v):
              print("::error:: version drift detected"); sys.exit(1)
          print("versions consistent")
          PY

      - name: Import smoke test
        run: python -c "import loglens; from loglens.cli import app; print('import OK')"

      - name: Lint (non-blocking)
        continue-on-error: true
        run: |
          pip install ruff
          ruff check src/ || true