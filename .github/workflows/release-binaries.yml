name: release-binaries

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (e.g. 0.12.0), without the leading v"
        required: true

permissions:
  contents: write

env:
  # Neural mode bundled into every binary so `--deep` works with no extra install.
  LOGLENS_BUNDLE_DEEP: "1"

jobs:
  # --------------------------------------------------------------------------- #
  build:
    name: build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64,  os: ubuntu-22.04,  asset: loglens-linux-x86_64 }
          - { name: macos-arm64,   os: macos-14,      asset: loglens-macos-arm64 }
          - { name: macos-x86_64,  os: macos-13,      asset: loglens-macos-x86_64 }
          - { name: windows-x86_64, os: windows-latest, asset: loglens-windows-x86_64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          V="${{ github.event.inputs.version }}"
          [ -z "$V" ] && V="${GITHUB_REF_NAME#v}"
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Install build deps
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install . pyinstaller
          pip install sentence-transformers torch --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Pre-download neural model (for offline --deep)
        shell: bash
        run: python scripts/download_model.py _models

      - name: Build binary (PyInstaller)
        shell: bash
        env:
          LOGLENS_BUNDLED_MODEL_DIR: _models
        run: pyinstaller packaging/pyinstaller/loglens.spec --noconfirm

      - name: Smoke test
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            ./dist/loglens/loglens.exe version
          else
            ./dist/loglens/loglens version
          fi

      - name: Package (tar.gz / zip)
        shell: bash
        run: |
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a -tzip "../${{ matrix.asset }}.zip" loglens >/dev/null
          else
            tar -czf "../${{ matrix.asset }}.tar.gz" loglens
          fi

      - name: Build .deb + .rpm (Linux only)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          bash packaging/linux/build_deb.sh "${{ steps.ver.outputs.version }}" dist amd64
          # (optional) also build an .rpm here with alien/nfpm if desired.

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.asset }}.tar.gz
            ${{ matrix.asset }}.zip
            loglens_*_amd64.deb

  # --------------------------------------------------------------------------- #
  publish-apt:
    name: publish APT repo (GitHub Pages)
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: |
          V="${{ github.event.inputs.version }}"
          [ -z "$V" ] && V="${GITHUB_REF_NAME#v}"
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Download the .deb from the release
        run: |
          gh release download "v${{ steps.ver.outputs.version }}" \
            --pattern 'loglens_*_amd64.deb' --dir dist
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Import signing key
        run: |
          echo "${{ secrets.APT_GPG_PRIVATE_KEY }}" | gpg --batch --import
          gpg --armor --export > public.key

      - name: Build signed APT repo (reprepro)
        run: |
          sudo apt-get update && sudo apt-get install -y reprepro
          KEYID=$(gpg --list-keys --with-colons | awk -F: '/^pub/{print $5; exit}')
          mkdir -p apt/conf
          cat > apt/conf/distributions <<EOF
          Origin: LogLens AI
          Label: LogLens AI
          Codename: stable
          Architectures: amd64
          Components: main
          Description: LogLens AI apt repository
          SignWith: ${KEYID}
          EOF
          reprepro -b apt includedeb stable dist/loglens_*_amd64.deb
          cp public.key apt/key.gpg

      - name: Publish to gh-pages (apt/)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ github.token }}
          publish_dir: ./apt
          destination_dir: apt
          keep_files: true

  # --------------------------------------------------------------------------- #
  update-taps:
    name: update Homebrew tap + Scoop bucket
    needs: build
    runs-on: ubuntu-22.04
    # `secrets` can't be used directly in an `if:` expression, so expose it as an
    # env var here and gate the step on that instead.
    env:
      TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: |
          V="${{ github.event.inputs.version }}"
          [ -z "$V" ] && V="${GITHUB_REF_NAME#v}"
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Compute asset checksums
        id: sums
        run: |
          V="${{ steps.ver.outputs.version }}"
          for a in loglens-macos-arm64.tar.gz loglens-macos-x86_64.tar.gz \
                   loglens-linux-x86_64.tar.gz loglens-windows-x86_64.zip; do
            gh release download "v$V" --pattern "$a" --dir a || true
          done
          {
            echo "arm64=$(sha256sum a/loglens-macos-arm64.tar.gz  | cut -d' ' -f1)"
            echo "intel=$(sha256sum a/loglens-macos-x86_64.tar.gz | cut -d' ' -f1)"
            echo "linux=$(sha256sum a/loglens-linux-x86_64.tar.gz | cut -d' ' -f1)"
            echo "win=$(sha256sum a/loglens-windows-x86_64.zip    | cut -d' ' -f1)"
          } >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}


      - name: Update tap + bucket
        if: ${{ env.TAP_TOKEN != '' }}
        run: |
          echo "version=${{ steps.ver.outputs.version }}"
          echo "arm64=${{ steps.sums.outputs.arm64 }}"
          echo "intel=${{ steps.sums.outputs.intel }}"
          echo "linux=${{ steps.sums.outputs.linux }}"
          echo "win=${{ steps.sums.outputs.win }}"
          echo "TODO: clone LoglensAI/homebrew-tap and LoglensAI/scoop-bucket,"
          echo "      sed the version/sha into the manifests, commit and push."