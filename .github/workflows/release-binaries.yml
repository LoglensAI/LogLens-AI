name: release-binaries

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Optional version override. Leave blank to use src/loglens/_version.py."
        required: false

permissions:
  contents: write

env:
  # Neural mode bundled into every binary so `--deep` works with no extra install.
  LOGLENS_BUNDLE_DEEP: "1"

jobs:
  # --------------------------------------------------------------------------- #
  build:
    name: build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64,  os: ubuntu-22.04,  asset: loglens-linux-x86_64 }
          - { name: macos-arm64,   os: macos-14,      asset: loglens-macos-arm64 }
          - { name: macos-x86_64,  os: macos-13,      asset: loglens-macos-x86_64 }
          - { name: windows-x86_64, os: windows-latest, asset: loglens-windows-x86_64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          # Source of truth is src/loglens/_version.py, so the .deb version always
          # matches what `loglens version` reports. A tag or manual input overrides it.
          V="${{ github.event.inputs.version }}"
          [ -z "$V" ] && V="${GITHUB_REF_NAME#v}"
          case "$V" in ""|refs/*|main|master)
            V="$(python -c "import runpy; print(runpy.run_path('src/loglens/_version.py')['__version__'])")"
          ;; esac
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Building LogLens $V"

      - name: Bake build provenance (commit + date)
        shell: bash
        run: |
          # Written into the binary so `loglens version --json` reports real values.
          printf 'COMMIT = "%s"\nBUILD_DATE = "%s"\n' \
            "${GITHUB_SHA:0:12}" "$(date -u +%Y-%m-%d)" > src/loglens/_build.py
          cat src/loglens/_build.py

      - name: Install build deps
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install . pyinstaller
          pip install sentence-transformers torch --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Pre-download neural model (for offline --deep)
        shell: bash
        run: python scripts/download_model.py _models

      - name: Build binary (PyInstaller)
        shell: bash
        env:
          LOGLENS_BUNDLED_MODEL_DIR: _models
        run: pyinstaller packaging/pyinstaller/loglens.spec --noconfirm

      - name: Smoke test
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            ./dist/loglens/loglens.exe version
          else
            ./dist/loglens/loglens version
          fi

      - name: Package (tar.gz / zip)
        shell: bash
        run: |
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a -tzip "../${{ matrix.asset }}.zip" loglens >/dev/null
          else
            tar -czf "../${{ matrix.asset }}.tar.gz" loglens
          fi

      - name: Build MSI (Windows only)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          # WiX v4 builds a machine-wide MSI from the PyInstaller onedir (dist\loglens\**).
          dotnet tool install --global wix >/dev/null 2>&1 || dotnet tool update --global wix
          export PATH="$PATH:$HOME/.dotnet/tools"
          wix --version
          wix build packaging/windows/loglens.wxs \
            -arch x64 \
            -d Version="${{ steps.ver.outputs.version }}" \
            -o "${{ matrix.asset }}.msi"
          ls -lh "${{ matrix.asset }}.msi"

      - name: Build .deb + .rpm (Linux only)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          bash packaging/linux/build_deb.sh "${{ steps.ver.outputs.version }}" dist amd64
          # (optional) also build an .rpm here with alien/nfpm if desired.

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            ${{ matrix.asset }}.tar.gz
            ${{ matrix.asset }}.zip
            ${{ matrix.asset }}.msi
            loglens_*_amd64.deb
          if-no-files-found: ignore

      - name: Attach to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.asset }}.tar.gz
            ${{ matrix.asset }}.zip
            ${{ matrix.asset }}.msi
            loglens_*_amd64.deb

  # --------------------------------------------------------------------------- #
  publish-apt:
    name: publish .deb + .rpm to Cloudsmith
    needs: build
    # Runs on a real release, and also on a manual dispatch so you can test the
    # Cloudsmith push without cutting a release or bumping the version. Skips if
    # the Cloudsmith key isn't set (checked in the push step).
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    # Cloudsmith hosts the apt/yum repos, signs packages server-side, and handles
    # large files + bandwidth — so no reprepro / GPG-in-CI / gh-pages needed.
    env:
      CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
    steps:
      - name: Resolve version
        id: ver
        run: |
          V="${{ github.event.inputs.version }}"
          [ -z "$V" ] && V="${GITHUB_REF_NAME#v}"
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Download packages from the release
        if: github.event_name == 'release'
        run: |
          gh release download "v${{ steps.ver.outputs.version }}" \
            --repo "${{ github.repository }}" \
            --pattern 'loglens_*_amd64.deb' --dir dist || true
          gh release download "v${{ steps.ver.outputs.version }}" \
            --repo "${{ github.repository }}" \
            --pattern 'loglens-*.x86_64.rpm' --dir dist || true
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Download packages from build artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/download-artifact@v4
        with:
          path: _artifacts

      - name: Collect packages into dist/
        if: github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p dist
          find _artifacts -name '*.deb' -exec cp {} dist/ \; 2>/dev/null || true
          find _artifacts -name '*.rpm' -exec cp {} dist/ \; 2>/dev/null || true

      - name: List packages to publish
        run: ls -lh dist || echo "no dist/ — nothing to publish"

      - name: Check Cloudsmith key is set
        run: |
          if [ -z "$CLOUDSMITH_API_KEY" ]; then
            echo "::error::CLOUDSMITH_API_KEY secret is not set — add it in repo settings."
            exit 1
          fi

      - name: Install Cloudsmith CLI
        run: pipx install cloudsmith-cli

      - name: Push to Cloudsmith
        run: |
          # nullglob: an unmatched pattern (e.g. no .rpm yet) expands to nothing,
          # so the loop is skipped cleanly instead of leaving a non-zero status.
          shopt -s nullglob
          # 'any-distro/any-version' makes one package serve every Debian/Ubuntu (deb)
          # or RHEL/Fedora (rpm) release.
          # --republish: re-pushing the same version overwrites it instead of
          # erroring (safe for re-runs; real upgrades still need a version bump).
          pushed=0
          for f in dist/loglens_*_amd64.deb; do
            cloudsmith push deb --republish loglensai/loglensai-363o/any-distro/any-version "$f"
            pushed=1
          done
          for f in dist/loglens-*.x86_64.rpm; do
            cloudsmith push rpm --republish loglensai/loglensai-363o/any-distro/any-version "$f"
            pushed=1
          done
          if [ "$pushed" = "0" ]; then
            echo "::warning::No .deb/.rpm found in dist/ — nothing pushed to Cloudsmith."
          fi

  # --------------------------------------------------------------------------- #
  update-taps:
    name: update Homebrew tap + Scoop bucket
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-22.04
    # `secrets` can't be used directly in an `if:` expression, so expose it as an
    # env var here and gate the step on that instead.
    env:
      TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: |
          V="${{ github.event.inputs.version }}"
          [ -z "$V" ] && V="${GITHUB_REF_NAME#v}"
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Compute asset checksums
        id: sums
        run: |
          V="${{ steps.ver.outputs.version }}"
          for a in loglens-macos-arm64.tar.gz loglens-macos-x86_64.tar.gz \
                   loglens-linux-x86_64.tar.gz loglens-windows-x86_64.zip; do
            gh release download "v$V" --pattern "$a" --dir a || true
          done
          sha() { [ -f "a/$1" ] && sha256sum "a/$1" | cut -d' ' -f1 || echo ""; }
          {
            echo "arm64=$(sha loglens-macos-arm64.tar.gz)"
            echo "intel=$(sha loglens-macos-x86_64.tar.gz)"
            echo "linux=$(sha loglens-linux-x86_64.tar.gz)"
            echo "win=$(sha loglens-windows-x86_64.zip)"
          } >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Update Homebrew tap + Scoop bucket
        if: ${{ env.TAP_TOKEN != '' }}
        env:
          V: ${{ steps.ver.outputs.version }}
          ARM64: ${{ steps.sums.outputs.arm64 }}
          INTEL: ${{ steps.sums.outputs.intel }}
          LINUX: ${{ steps.sums.outputs.linux }}
          WIN: ${{ steps.sums.outputs.win }}
        run: |
          set -euo pipefail
          git config --global user.name  "loglens-release-bot"
          git config --global user.email "release-bot@loglensai.com"

          # --- Homebrew tap: LoglensAI/homebrew-tap (Formula/loglens.rb) --------
          if git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/LoglensAI/homebrew-tap.git" tap 2>/dev/null; then
            mkdir -p tap/Formula
            sed -e "s|^  version .*|  version \"${V}\"|" \
                -e "s|/download/v[0-9][^/]*/|/download/v${V}/|g" \
                -e "s|REPLACED_BY_CI_ARM64|${ARM64}|" \
                -e "s|REPLACED_BY_CI_INTEL|${INTEL}|" \
                -e "s|REPLACED_BY_CI_LINUX|${LINUX}|" \
                packaging/homebrew/loglens.rb > tap/Formula/loglens.rb
            ( cd tap
              git add Formula/loglens.rb
              git commit -m "loglens ${V}" || { echo "no formula change"; exit 0; }
              git push )
            echo "Homebrew tap updated to ${V}."
          else
            echo "::warning::Could not clone LoglensAI/homebrew-tap — create it (with Formula/) to enable 'brew install loglensai/tap/loglens'."
          fi

          # --- Scoop bucket: LoglensAI/scoop-bucket (loglens.json) --------------
          if git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/LoglensAI/scoop-bucket.git" bucket 2>/dev/null; then
            sed -e "s|\"version\": *\"[^\"]*\"|\"version\": \"${V}\"|" \
                -e "s|/download/v[0-9][^/]*/|/download/v${V}/|g" \
                packaging/scoop/loglens.json > bucket/loglens.json
            # fill the windows zip hash if the manifest carries a top-level "hash"
            if grep -q '"hash"' bucket/loglens.json && [ -n "${WIN}" ]; then
              sed -i "s|\"hash\": *\"[^\"]*\"|\"hash\": \"${WIN}\"|" bucket/loglens.json
            fi
            ( cd bucket
              git add loglens.json
              git commit -m "loglens ${V}" || { echo "no manifest change"; exit 0; }
              git push )
            echo "Scoop bucket updated to ${V}."
          else
            echo "::warning::Could not clone LoglensAI/scoop-bucket — create it to enable 'scoop install loglens'."
          fi
  # --------------------------------------------------------------------------- #
  attach-installers:
    name: attach install scripts to release
    if: github.event_name == 'release'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Attach install.sh + install.ps1
        uses: softprops/action-gh-release@v2
        with:
          files: |
            scripts/install.sh
            scripts/install.ps1
