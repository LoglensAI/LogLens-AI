ShortDescription: Local, privacy-first log anomaly detection with neural mode built in.
Description: |-
  LogLens AI analyzes log files for anomalies entirely on your machine - no data
  leaves the host. It ships a self-contained runtime (no Python required) and a
  resident warm daemon so repeat runs are near-instant. Fast (TF-IDF), turbo
  (parallel scan) and deep (neural) modes are all included.
