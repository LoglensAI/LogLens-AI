[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "loglensai"
dynamic = ["version"]
description = "AI-powered log anomaly detection & incident grouping: local, fast, and explainable."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    { name = "Paras Rajput", email = "pr8101999@gmail.com" },
]
keywords = [
  "logging",
  "log-analysis",
  "anomaly-detection",
  "structured-logging",
  "observability",
  "incident-response",
  "devops",
  "site-reliability-engineering",
  "machine-learning",
  "nlp",
  "ai",
  "llm",
  "rca",
  "root-cause-analysis",
  "log-analytics"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Logging",
    "Topic :: System :: Monitoring",
    "Topic :: Software Development :: Debuggers",
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
    "aiofiles>=23.0.0",
    "aiohttp>=3.9.0",
    "scikit-learn>=1.4,<2.0",
    "numpy>=1.26.0",
    "joblib>=1.3",
    "psutil>=5.9",
    "platformdirs>=4.0.0",
]

[project.optional-dependencies]
deep = [
    "sentence-transformers>=2.2.0",
    "torch>=2.0.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "anyio>=4.0.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "import-linter>=2.0",
]

[project.scripts]
loglens = "loglens.interface.cli:main"

[tool.hatch.version]
path = "src/loglens/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/loglens"]
artifacts = ["src/loglens/assets/*.pkl"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

# Architectural fitness function: the layered dependency rule is enforced in CI,
# not just documented. Dependencies point one way and inward:
#   interface -> application -> {detection, infrastructure} -> domain
# `detection` and `infrastructure` are independent peers (neither may import the
# other). Any inward layer importing an outer one fails the build. See
# `lint-imports` in the CI "architecture" step and docs/SYSTEM_DESIGN.md.
[tool.importlinter]
root_package = "loglens"

[[tool.importlinter.contracts]]
name = "Layered architecture (domain <- detection|infrastructure <- application <- interface)"
type = "layers"
layers = [
    "loglens.interface",
    "loglens.application",
    "loglens.detection | loglens.infrastructure",
    "loglens.domain",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4"]
ignore = [
    "E501",  # line length is enforced by the formatter, not the linter
    "B008",  # typer uses function calls (Option/Argument) as arg defaults
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B", "E402"]
"src/loglens/interface/cli.py" = ["F821"]

[tool.mypy]
python_version = "3.10"
files = ["src/loglens"]
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
ignore_missing_imports = true
disable_error_code = ["import-untyped"]

# numpy 2.x ships PEP 695 (`type X = ...`) stubs that mypy cannot parse when
# targeting Python < 3.12 (this fails under a 3.12 CI runner). We don't rely on
# deep numpy typing, so skip its stubs and treat numpy as untyped — keeps mypy
# green on every supported Python version.
[[tool.mypy.overrides]]
module = ["numpy", "numpy.*"]
follow_imports = "skip"
follow_imports_for_stubs = true

[tool.coverage.run]
source = ["loglens"]
omit = ["*/tests/*"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[project.urls]
"Homepage" = "https://loglensai.com"
"Bug Tracker" = "https://github.com/LoglensAI/LogLens-AI/issues"
"Source Code" = "https://github.com/LoglensAI/LogLens-AI"
"Documentation" = "https://github.com/LoglensAI/LogLens-AI/blob/main/docs/DOCUMENTATION.md"